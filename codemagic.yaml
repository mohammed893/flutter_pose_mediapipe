workflows:
  flutter-plugin-example-ios:
    name: Build Flutter Plugin Example (iOS)

    environment:
      flutter: stable
      xcode: 16.4
      cocoapods: default

    scripts:
      - name: Get Flutter packages (root)
        script: flutter pub get

      - name: Get packages for example app
        script: |
          cd example
          flutter pub get

      - name: Analyze package and example
        script: flutter analyze || true

      - name: Install CocoaPods for the example app
        script: |
          cd example/ios
          pod install

      - name: Build iOS example app with xcodebuild (no signing)
        script: |
          cd example/ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

    artifacts:
      - example/build/ios/iphoneos/*.app
      - example/ios/build/**/*.app
      - example/ios/Pods/Target Support Files/**/*.xcconfig
